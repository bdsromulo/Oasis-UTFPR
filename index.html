    <!-- Fontes auto-hospedadas via @fontsource (importadas em src/main.tsx);
         nenhuma requisição a CDN externa, preservando a privacidade local-first. -->
    <script>
      (function() {
        try {
          var p = JSON.parse(localStorage.getItem('oasis.preferencias.v1'));
          var t = p ? p.tema : 'sistema';
          if (t === 'escuro' || (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
